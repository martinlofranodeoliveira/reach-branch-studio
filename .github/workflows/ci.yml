name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Consume committed dependency lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict types, kinematics, branches and DOM
        run: npm test
      - name: Asserting offline demo
        run: npm run demo -- --assert
      - name: Production build and HTML contract
        run: npm run build
